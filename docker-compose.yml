## The API plus the four worker processes that dokploy was never running.
##
## All five are the same production image, same `dist/main.js`; PROCESS_ROLE
## picks which module bootstraps (src/main.ts:65). No ts-node, no dev stage.
##
## One `.env` for everything, mounted rather than passed through `env_file:`.
## Compose interpolates `$` inside env_file values, and the signing keys are
## argon2id blobs (`enc:argon2id$m=65536,t=3,p=1$…`) — env_file would deliver
## them truncated and every worker would die on "must be an argon2id$… blob".
## Mounting the file leaves the bytes alone; ConfigModule reads it directly, and
## PROCESS_ROLE from `environment:` wins over the `api` in the file because Nest
## never overwrites a variable already in the process.

x-worker: &worker
  build:
    context: .
  volumes:
    - ./.env:/app/.env:ro
  restart: unless-stopped
  # Every process has migrationsRun: true, so a cold start races five writers on
  # the migrations table. The API wins the race by being the only one healthy
  # first.
  depends_on:
    api:
      condition: service_healthy

services:
  api:
    build:
      context: .
    volumes:
      - ./.env:/app/.env:ro
    restart: unless-stopped
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  issuer:
    <<: *worker
    environment:
      PROCESS_ROLE: issuer

  relayer:
    <<: *worker
    environment:
      PROCESS_ROLE: relayer

  settlement:
    <<: *worker
    environment:
      PROCESS_ROLE: settlement

  monitor:
    <<: *worker
    environment:
      PROCESS_ROLE: monitor
