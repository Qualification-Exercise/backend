name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wdk_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Checkout contracts (drift fixtures)
        uses: actions/checkout@v4
        with:
          repository: Qualification-Exercise/contracts
          ref: main
          path: contract

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: wdk_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-only-jwt-secret-value-not-used-anywhere-32
          AUTH_ISSUER: https://ci.invalid
          AUTH_AUDIENCE: wdk-backend-ci
          JWKS_URI: https://ci.invalid/.well-known/jwks.json
          GOOGLE_IOS_CLIENT_ID: ci.apps.googleusercontent.com
          GOOGLE_ANDROID_CLIENT_ID: ci.apps.googleusercontent.com
          SEED_BACKUP_ENCRYPTION_KEY: ci-only-seed-backup-key-not-used-anywhere
          INDEXER_BASE_URL: https://ci.invalid/indexer
          INDEXER_API_KEY: ci
          UTILITY_TOKEN_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000000"
          PAYMENT_REFS_FIXTURE: ${{ github.workspace }}/contract/test/fixtures/payment-refs.json
          ENTITLEMENT_FIXTURE: ${{ github.workspace }}/contract/test/fixtures/entitlement.json
        run: npm run test:cov

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/coverage-final.json

      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log("| metric | covered | count |");
            console.log("| --- | --- | --- |");
            for (const k of ["statements", "branches", "functions", "lines"]) {
              console.log(row(k));
            }
          ' >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: wdk-backend:latest
